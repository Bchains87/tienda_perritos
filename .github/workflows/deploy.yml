name: CI/CD Pipeline Tienda Perritos

# 1. ¿Cuándo se activa? (Trigger según rúbrica)
on:
  push:
    branches:
      - deploy

jobs:
  # ETAPA 1: Construir y Publicar en Docker Hub
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y Subir Imagen Backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/tienda-backend:latest

      - name: Construir y Subir Imagen Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/tienda-frontend:latest

  # ETAPA 2: Despliegue Automático en AWS EC2
  deploy-frontend:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Actualizar EC2 Frontend (Web)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FRONTEND_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/tienda-frontend:latest
            sudo docker rm -f tienda-frontend || true
            sudo docker run -d --name tienda-frontend -p 80:80 ${{ secrets.DOCKER_USERNAME }}/tienda-frontend:latest

  deploy-backend:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Actualizar EC2 Backend (App) vía Proxy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.BACKEND_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}       # <--- Esta es la llave del Backend
          proxy_host: ${{ secrets.FRONTEND_HOST }}
          proxy_username: ec2-user
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }} # <--- Esta es la llave del Frontend
          script: |
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/tienda-backend:latest
            sudo docker rm -f tienda-backend || true
            sudo docker run -d --name tienda-backend -p 3001:3001 -e DB_HOST=10.0.10.120 -e DB_USER=alumno -e DB_PASSWORD=alumno123 -e DB_NAME=tienda_perritos -e DB_PORT=5432 ${{ secrets.DOCKER_USERNAME }}/tienda-backend:latest