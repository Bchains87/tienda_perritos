name: CI/CD Pipeline Tienda Perritos

on:
  push:
    branches:
      - deploy

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y Subir Imagen Backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/tienda-backend:latest

      - name: Construir y Subir Imagen Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/tienda-frontend:latest

  deploy-frontend:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Actualizar EC2 Frontend (Web)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FRONTEND_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Puerto explícito por si acaso
          port: 22
          script: |
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/tienda-frontend:latest
            sudo docker rm -f tienda-frontend || true
            sudo docker run -d \
              --name tienda-frontend \
              -p 80:80 \
              --restart unless-stopped \
              ${{ secrets.DOCKER_USERNAME }}/tienda-frontend:latest

  deploy-backend:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Actualizar EC2 Backend vía proxy Frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          # IP PRIVADA del backend (ej: 10.0.9.203)
          host: ${{ secrets.BACKEND_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          proxy_host: ${{ secrets.FRONTEND_HOST }}
          proxy_username: ec2-user
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_port: 22
          script: |
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/tienda-backend:latest
            sudo docker rm -f tienda-backend || true
            sudo docker run -d \
              --name tienda-backend \
              -p 3001:3001 \
              --restart unless-stopped \
              -e DB_HOST=${{ secrets.DB_HOST }} \
              -e DB_USER=${{ secrets.DB_USER }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -e DB_NAME=${{ secrets.DB_NAME }} \
              -e DB_PORT=${{ secrets.DB_PORT }} \
              ${{ secrets.DOCKER_USERNAME }}/tienda-backend:latest
